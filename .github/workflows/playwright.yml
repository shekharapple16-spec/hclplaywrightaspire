name: Playwright Tests (Merged Report)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        totalShards: [4]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (sharded)
        run: |
          set +e

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR detected → running changed tests only"
            npx playwright test \
              --only-changed=origin/${{ github.base_ref }} \
              --shard=${{ matrix.shard }}/${{ matrix.totalShards }} \
              --reporter=blob
          else
            echo "Main branch → running full suite"
            npx playwright test \
              --shard=${{ matrix.shard }}/${{ matrix.totalShards }} \
              --reporter=blob
          fi

          # Ensure blob-report folder always exists
          mkdir -p blob-report

      - name: Debug blob report
        if: always()
        run: |
          echo "Blob report content:"
          ls -R blob-report || echo "No blob files found"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  merge-report:
    needs: playwright-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports

      - name: Debug downloaded blob reports
        run: |
          echo "Downloaded blob reports:"
          ls -R all-blob-reports

      - name: Merge Playwright reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            all-blob-reports

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

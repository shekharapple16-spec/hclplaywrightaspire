name: Playwright Tests (PR Impacted Only + Full on Main)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  playwright-tests:
    name: Playwright Tests (Shards)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        totalShards: [4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔑 Fetch base branch for PR diff
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

      # 🔍 Detect changed Playwright test files
      - name: Detect changed test files
        id: changed-tests
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_TESTS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.spec\.ts$' || true)
          echo "Changed tests:"
          echo "$CHANGED_TESTS"
          echo "changed_tests=$CHANGED_TESTS" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ▶️ Run tests ONLY when required
      - name: Run Playwright tests
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ -z "${{ steps.changed-tests.outputs.changed_tests }}" ]]; then
              echo "PR detected but no test files changed → skipping Playwright execution"
              exit 0
            fi

            echo "PR detected → running only impacted tests"
            npx playwright test \
              --only-changed=origin/${{ github.base_ref }} \
              --shard=${{ matrix.shard }}/${{ matrix.totalShards }} \
              --reporter=blob

          else
            echo "Main/Master branch → running full suite"
            npx playwright test \
              --shard=${{ matrix.shard }}/${{ matrix.totalShards }} \
              --reporter=blob
          fi

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  merge-report:
    name: Merge Playwright Reports
    needs: playwright-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports

      - name: Merge Playwright reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            all-blob-reports

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

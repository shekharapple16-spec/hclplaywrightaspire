name: Playwright Tests (PR Impacted Only + Full on Main)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔑 Fetch base branch for PR diff
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ▶️ Run Playwright tests
      - name: Run Playwright tests
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR detected → running ONLY impacted tests"
            npx playwright test \
              --only-changed=origin/${{ github.base_ref }} \
              --reporter=blob
          else
            echo "Main/Master branch → running FULL test suite"
            npx playwright test \
              --reporter=blob
          fi

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report
          path: blob-report
          retention-days: 7

  merge-report:
    name: Merge Playwright Report
    needs: playwright-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Download blob report
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
        continue-on-error: true

      - name: Check blob reports exist
        run: |
          if [ ! -d "all-blob-reports" ] || [ -z "$(ls -A all-blob-reports)" ]; then
            echo "No blob reports found. Skipping merge."
            exit 0
          fi

      - name: Merge Playwright reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            all-blob-reports

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

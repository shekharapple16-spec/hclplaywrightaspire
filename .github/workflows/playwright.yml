name: Playwright Tests – Grafana Cloud

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        totalShards: [4]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (sharded)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR detected → running changed tests only"
            npx playwright test \
              --only-changed=origin/${{ github.base_ref }} \
              --shard=${{ matrix.shard }}/${{ matrix.totalShards }}
          else
            echo "Main branch → running full suite"
            npx playwright test \
              --shard=${{ matrix.shard }}/${{ matrix.totalShards }}
          fi

      - name: Upload Playwright Report (Shard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

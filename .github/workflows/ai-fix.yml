name: AI Fix Agent

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Failing test file'
        required: true
      test_title:
        description: 'Exact test title'
        required: true
      phone_number:
        description: 'WhatsApp phone'
        required: true
      original_error:
        description: 'Initial error'
        required: false
        default: ''

jobs:
  ai-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Run failing test
        run: |
          npx playwright test \
            "${{ github.event.inputs.test_file }}" \
            --grep "${{ github.event.inputs.test_title }}"
        continue-on-error: true
        env:
          AI_FIX_MODE: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          PHONE_NUMBER: ${{ github.event.inputs.phone_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ORIGINAL_ERROR: ${{ github.event.inputs.original_error }}
          FIX_SENT_SENTINEL: /tmp/fix-sent.ok

      - name: Verify fix sent
        run: |
          if [ ! -f /tmp/fix-sent.ok ]; then
            echo "❌ Fix NOT sent"
            exit 1
          fi
          echo "✅ Fix sent"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-fix-artifacts
          path: |
            test-results/
            /tmp/fix-sent.ok

name: AI Fix Agent
# Stripped down — fixtures.js handles all AI logic.
# This workflow just runs the failing test; the auto fixture
# captures DOM, calls Groq, and POSTs the fix to the server.

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Failing test file (e.g. tests/day3/test1.spec.js)'
        required: true
      test_title:
        description: 'Exact test title'
        required: true
      phone_number:
        description: 'WhatsApp phone (country code, no +)'
        required: true

jobs:
  ai-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Run the specific failing test.
      # The aiDiagnostics auto-fixture fires on failure:
      #   → compresses DOM
      #   → calls Groq for fix
      #   → POSTs fix to /ai-fix-callback on server
      - name: Run failing test
        run: |
          npx playwright test \
            "${{ github.event.inputs.test_file }}" \
            --grep "${{ github.event.inputs.test_title }}" \
            --retries=0 \
            --reporter=line
        continue-on-error: true
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          BOT_WEBHOOK_URL:  ${{ secrets.BOT_WEBHOOK_URL }}
          BOT_SECRET:       ${{ secrets.BOT_SECRET }}
          PHONE_NUMBER:     ${{ github.event.inputs.phone_number }}
          RUN_URL:          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-fix-artifacts
          path: |
            test-results/
          retention-days: 3

name: AI Fix Agent

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Failing test file (e.g. tests/day3/login.spec.js)'
        required: true
      test_title:
        description: 'Exact test title'
        required: true
      issue_number:
        description: 'GitHub issue number'
        required: true
      phone_number:
        description: 'WhatsApp phone (country code, no +)'
        required: true

jobs:
  playwright-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── Step 1: Run failing test with screenshot + trace forced ON ─
      # We pass use.screenshot and use.trace via CLI override
      # This matches your playwright.yml setup but adds capture
      - name: Run failing test with full capture
        continue-on-error: true
        run: |
          npx playwright test \
            "${{ github.event.inputs.test_file }}" \
            --grep "${{ github.event.inputs.test_title }}" \
            --reporter=json \
            --retries=0 \
            --trace=on \
            --screenshot=on \
            --output=test-results \
            2>&1 | tee test-output.txt
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json

      # ── Step 2: Extract error + screenshot + DOM from trace ────────
      - name: Extract agent context
        run: |
          node << 'JSEOF'
          const fs   = require('fs');
          const path = require('path');

          function findFiles(dir, ext, out = []) {
            if (!fs.existsSync(dir)) return out;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory()) findFiles(full, ext, out);
              else if (f.name.endsWith(ext)) out.push(full);
            }
            return out;
          }

          const screenshots = findFiles('test-results', '.png');
          const htmlFiles   = findFiles('test-results', '.html');
          const rawOutput   = fs.existsSync('test-output.txt')
            ? fs.readFileSync('test-output.txt', 'utf8') : '';

          console.log(`Screenshots found: ${screenshots.length}`);
          console.log(`HTML files found:  ${htmlFiles.length}`);
          console.log(`Screenshot paths:  ${screenshots.join(', ')}`);
          console.log(`HTML paths:        ${htmlFiles.join(', ')}`);

          // ── Parse error from JSON report ──
          let error = '';
          try {
            if (fs.existsSync('playwright-results.json')) {
              const report = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
              function walk(suite) {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    const status = test.status || test.results?.[0]?.status;
                    const err    = test.results?.[0]?.error?.message || '';
                    const stack  = test.results?.[0]?.error?.stack  || '';
                    if (status === 'failed' || status === 'unexpected') {
                      error = `${err}\n${stack}`.trim();
                    }
                  }
                }
                for (const child of suite.suites || []) walk(child);
              }
              for (const suite of report.suites || []) walk(suite);
            }
          } catch(e) {
            console.log('Could not parse JSON report:', e.message);
          }

          // Fallback: grep terminal output for error
          if (!error) {
            const errLines = rawOutput.split('\n').filter(l =>
              l.includes('Error:') || l.includes('expect(') ||
              l.includes('TimeoutError') || l.includes('locator(') ||
              l.includes('strict mode') || l.includes('waiting for')
            );
            error = errLines.slice(0, 20).join('\n');
          }

          console.log(`Error captured: ${error.slice(0, 200)}`);

          // ── Screenshot: take the LAST one (failure moment) ──
          let screenshotBase64 = '';
          if (screenshots.length > 0) {
            // Sort by modification time — last modified = failure moment
            const sorted = screenshots
              .map(f => ({ f, t: fs.statSync(f).mtimeMs }))
              .sort((a, b) => b.t - a.t);
            const lastShot = sorted[0].f;
            screenshotBase64 = fs.readFileSync(lastShot).toString('base64');
            console.log(`Screenshot: ${lastShot} (${Math.round(screenshotBase64.length/1024)}KB b64)`);
          } else {
            console.log('⚠️ No screenshots found — trace may not have captured them');
          }

          // ── DOM: extract from Playwright HTML snapshot ──
          // Playwright saves HTML snapshots inside test-results/
          // These contain the ACTUAL page DOM at the point of failure
          let domSnapshot = '';
          if (htmlFiles.length > 0) {
            // Filter out playwright-report HTML (we want page snapshots)
            const pageSnaps = htmlFiles.filter(f =>
              !f.includes('playwright-report') &&
              !f.includes('index.html')
            );
            const target = pageSnaps.length > 0 ? pageSnaps[0] : htmlFiles[0];
            console.log(`Using DOM from: ${target}`);

            const html = fs.readFileSync(target, 'utf8');
            // Extract body content — remove scripts/styles, keep structure
            let body = (html.match(/<body[^>]*>([\s\S]*?)<\/body>/i) || ['', html])[1];
            body = body
              .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
              .replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/\s+/g, ' ')
              .trim();
            domSnapshot = body.slice(0, 12000);
            console.log(`DOM snapshot: ${domSnapshot.length} chars`);
          } else {
            console.log('⚠️ No HTML snapshots found in test-results/');
            // Last resort: dump raw terminal output context
            domSnapshot = `No DOM snapshot captured. Raw error output:\n${rawOutput.slice(-2000)}`;
          }

          // ── Write output ──
          const output = {
            error,
            screenshotBase64,
            domSnapshot,
            rawOutput: rawOutput.slice(-4000),
          };
          fs.writeFileSync('agent-output.json', JSON.stringify(output));
          console.log('✅ Agent context written');
          console.log(`  Screenshot: ${screenshotBase64.length > 100 ? 'YES ✅' : 'NO ❌'}`);
          console.log(`  DOM:        ${domSnapshot.length > 100 ? 'YES ✅' : 'NO ❌'}`);
          JSEOF

      # ── Step 3: Read ALL source files ─────────────────────────────
      - name: Read source files
        run: |
          node << 'JSEOF'
          const fs   = require('fs');
          const path = require('path');
          const testFile = '${{ github.event.inputs.test_file }}';
          const sources  = {};

          function readDir(dir) {
            if (!fs.existsSync(dir)) return;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory()) readDir(full);
              else if (f.name.match(/\.(js|ts)$/) && !f.name.includes('.config.')) {
                sources[full] = fs.readFileSync(full, 'utf8').slice(0, 4000);
              }
            }
          }

          // Full test file (no truncation — most important)
          if (fs.existsSync(testFile)) {
            sources[testFile] = fs.readFileSync(testFile, 'utf8');
            console.log(`✅ Test file: ${testFile} (${sources[testFile].length} chars)`);
          } else {
            console.log(`❌ Test file not found: ${testFile}`);
          }

          readDir('pages');
          readDir('utils');
          readDir('scripts');
          if (fs.existsSync('fixtures.js')) sources['fixtures.js'] = fs.readFileSync('fixtures.js', 'utf8');
          if (fs.existsSync('fixtures.ts')) sources['fixtures.ts'] = fs.readFileSync('fixtures.ts', 'utf8');
          if (fs.existsSync('playwright.config.js')) sources['playwright.config.js'] = fs.readFileSync('playwright.config.js', 'utf8').slice(0, 2000);

          console.log(`📁 Source files (${Object.keys(sources).length}): ${Object.keys(sources).join(', ')}`);
          fs.writeFileSync('source-files.json', JSON.stringify(sources));
          JSEOF

      # ── Step 4: Upload artifacts ───────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-fix-agent-artifacts
          path: |
            test-results/
            playwright-results.json
            agent-output.json
            source-files.json
            test-output.txt
          retention-days: 7

      # ── Step 5: POST everything to WhatsApp bot ────────────────────
      - name: Send to bot
        run: |
          node << 'JSEOF'
          const fs    = require('fs');
          const https = require('https');
          const http  = require('http');
          const url   = require('url');

          const botUrl    = '${{ secrets.BOT_WEBHOOK_URL }}';
          const botSecret = '${{ secrets.BOT_SECRET }}';

          if (!botUrl) { console.error('❌ BOT_WEBHOOK_URL not set'); process.exit(1); }

          const agentOut  = JSON.parse(fs.readFileSync('agent-output.json',  'utf8'));
          const sources   = JSON.parse(fs.readFileSync('source-files.json',  'utf8'));

          const payload = JSON.stringify({
            secret:      botSecret,
            type:        'ai_fix_context',
            phone:       '${{ github.event.inputs.phone_number }}',
            issueNumber: parseInt('${{ github.event.inputs.issue_number }}'),
            testTitle:   '${{ github.event.inputs.test_title }}',
            testFile:    '${{ github.event.inputs.test_file }}',
            runUrl:      'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            testResult: {
              passed:      false,
              error:       agentOut.error,
              failedTests: [{ title: '${{ github.event.inputs.test_title }}', error: agentOut.error }],
            },
            artifacts: {
              screenshotBase64: agentOut.screenshotBase64,
              domSnapshot:      agentOut.domSnapshot,
              rawErrorOutput:   agentOut.rawOutput,
            },
            sourceFiles: sources,
          });

          console.log(`📤 Sending to bot (${Math.round(payload.length/1024)}KB)`);
          console.log(`   Screenshot: ${agentOut.screenshotBase64?.length > 100 ? 'YES ✅' : 'NO ❌'}`);
          console.log(`   DOM:        ${agentOut.domSnapshot?.length > 100 ? 'YES ✅' : 'NO ❌'}`);
          console.log(`   Error:      ${agentOut.error?.slice(0, 150)}`);
          console.log(`   Sources:    ${Object.keys(sources).length} files`);

          const endpoint = new url.URL('/ai-fix-callback', botUrl);
          const isHttps  = endpoint.protocol === 'https:';
          const options  = {
            hostname: endpoint.hostname,
            port:     endpoint.port || (isHttps ? 443 : 80),
            path:     endpoint.pathname,
            method:   'POST',
            headers: {
              'Content-Type':   'application/json',
              'Content-Length': Buffer.byteLength(payload),
              'x-bot-secret':   botSecret,
            },
          };

          const proto = isHttps ? https : http;
          const req   = proto.request(options, res => {
            let body = '';
            res.on('data', d => body += d);
            res.on('end', () => {
              if (res.statusCode === 200) {
                console.log(`✅ Bot notified (${res.statusCode})`);
              } else {
                console.error(`❌ Bot returned ${res.statusCode}: ${body}`);
                process.exit(1);
              }
            });
          });
          req.on('error', e => { console.error('❌', e.message); process.exit(1); });
          req.setTimeout(30000, () => { req.destroy(); process.exit(1); });
          req.write(payload);
          req.end();
          JSEOF

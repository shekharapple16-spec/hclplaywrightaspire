name: AI Fix Agent

# Triggered by WhatsApp bot when user says "fix issue #N"
# Acts as a full Playwright agent:
#   1. Runs the exact failing test with full capture enabled
#   2. Takes screenshot at every step (on fail AND on pass)
#   3. Captures full DOM snapshot (accessibility tree + HTML)
#   4. Captures Playwright trace (full timeline of actions)
#   5. Reads all source + page object files
#   6. POSTs everything to the bot → Gemini writes a real fix

# REQUIRED REPO SECRETS:
#   BOT_WEBHOOK_URL  → https://whatsapppiplinemeta.onrender.com
#   BOT_SECRET       → same value as BOT_WEBHOOK_SECRET in Render

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Failing test file path (e.g. tests/day3/login.spec.js)'
        required: true
      test_title:
        description: 'Exact test title to grep for'
        required: true
      issue_number:
        description: 'GitHub issue number'
        required: true
      phone_number:
        description: 'WhatsApp phone number (with country code, no +)'
        required: true

jobs:
  playwright-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node setup ────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install deps ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Install Playwright + Chromium ─────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── 5. Write a temp playwright config with ALL capture ON ─────
      #   We override the project config to force:
      #     - screenshot: on (every test, not just failures)
      #     - trace: on (full timeline)
      #     - video: off (saves space)
      #     - retries: 0 (see raw failure, no retries masking it)
      - name: Write agent playwright config
        run: |
          cat > playwright.agent.config.js << 'EOF'
          const { defineConfig, devices } = require('@playwright/test');
          const base = require('./playwright.config');

          module.exports = defineConfig({
            ...base,
            retries: 0,
            workers: 1,
            use: {
              ...base.use,
              headless: true,
              screenshot: 'on',        // screenshot every step
              trace: 'on',             // full trace always
              video: 'off',            // save disk space
              // Capture DOM snapshot on every action
              actionTimeout: 15000,
              navigationTimeout: 30000,
            },
            projects: [
              {
                name: 'agent-chromium',
                use: {
                  ...devices['Desktop Chrome'],
                  screenshot: 'on',
                  trace: 'on',
                },
              },
            ],
          });
          EOF

      # ── 6. Run the EXACT failing test ────────────────────────────
      - name: Run failing test (Playwright Agent)
        id: run_test
        continue-on-error: true
        run: |
          npx playwright test \
            "${{ github.event.inputs.test_file }}" \
            --grep "${{ github.event.inputs.test_title }}" \
            --config=playwright.agent.config.js \
            --reporter=json,html \
            --output=test-results \
            2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # ── 7. Extract DOM snapshot from Playwright trace ─────────────
      #   Playwright trace contains the full accessibility tree
      #   and DOM snapshot at every action — we extract it here
      - name: Extract DOM + error + screenshots
        id: extract
        run: |
          node << 'JSEOF'
          const fs   = require('fs');
          const path = require('path');

          // ── Find test results ──
          function findFiles(dir, ext, results = []) {
            if (!fs.existsSync(dir)) return results;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory()) findFiles(full, ext, results);
              else if (f.name.endsWith(ext)) results.push(full);
            }
            return results;
          }

          const screenshots = findFiles('test-results', '.png');
          const traces      = findFiles('test-results', '.zip');
          const htmlFiles   = findFiles('test-results', '.html');

          console.log(`Found: ${screenshots.length} screenshots, ${traces.length} traces, ${htmlFiles.length} HTML files`);

          // ── Parse JSON report for structured error ──
          const rawOutput = fs.existsSync('test-output.txt')
            ? fs.readFileSync('test-output.txt', 'utf8') : '';

          let testResult = { passed: false, error: '', failedTests: [], allErrors: [] };

          // Try to find inline JSON from stdout
          try {
            const lines    = rawOutput.split('\n');
            let jsonStr    = '';
            let inJson     = false;
            for (const line of lines) {
              if (line.trim().startsWith('{"suites"') || line.trim().startsWith('{"errors"')) { inJson = true; jsonStr = ''; }
              if (inJson) jsonStr += line;
            }
            if (jsonStr) {
              const report = JSON.parse(jsonStr);
              function walk(suite) {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    const status = test.status || test.results?.[0]?.status;
                    const err    = test.results?.[0]?.error?.message || '';
                    const stack  = test.results?.[0]?.error?.stack  || '';
                    if (status === 'failed' || status === 'unexpected') {
                      testResult.failedTests.push({ title: spec.title, error: err, stack });
                      testResult.allErrors.push(err);
                    }
                  }
                }
                for (const child of suite.suites || []) walk(child);
              }
              for (const suite of report.suites || []) walk(suite);
              testResult.passed = testResult.failedTests.length === 0;
              testResult.error  = testResult.failedTests[0]?.error || '';
            }
          } catch (e) {
            // Fallback: grep for error lines
            const errLines = rawOutput.split('\n').filter(l =>
              l.includes('Error:') || l.includes('expect(') || l.includes('TimeoutError') || l.includes('locator(')
            );
            testResult.error = errLines.slice(0, 15).join('\n');
          }

          // ── Read screenshots as base64 ──
          // Take the LAST screenshot (most likely the failure moment)
          let screenshotBase64 = '';
          if (screenshots.length > 0) {
            const lastShot = screenshots[screenshots.length - 1];
            screenshotBase64 = fs.readFileSync(lastShot).toString('base64');
            console.log(`📸 Screenshot: ${lastShot} (${Math.round(screenshotBase64.length / 1024)}KB b64)`);
          }

          // ── Extract DOM from HTML snapshot ──
          // Playwright saves an HTML file with the full page DOM at failure
          let domSnapshot = '';
          if (htmlFiles.length > 0) {
            // Find the most relevant HTML (not the report, but the page snapshot)
            const pageHtml = htmlFiles.find(f => !f.includes('playwright-report')) || htmlFiles[0];
            const html     = fs.readFileSync(pageHtml, 'utf8');
            // Extract body — remove scripts/styles to reduce size, keep structure
            const bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
            let body        = bodyMatch ? bodyMatch[1] : html;
            // Remove script tags
            body = body.replace(/<script[\s\S]*?<\/script>/gi, '');
            // Remove style tags
            body = body.replace(/<style[\s\S]*?<\/style>/gi, '');
            // Trim whitespace
            body = body.replace(/\s+/g, ' ').trim();
            domSnapshot = body.slice(0, 10000); // 10K chars of clean DOM
            console.log(`🖥️ DOM snapshot: ${domSnapshot.length} chars`);
          }

          // ── Write outputs ──
          const output = {
            testResult,
            screenshotBase64,
            domSnapshot,
            traceFiles:      traces.map(t => path.basename(t)),
            screenshotFiles: screenshots.map(s => path.basename(s)),
            rawErrorOutput:  rawOutput.slice(-3000), // last 3000 chars of terminal output
          };

          fs.writeFileSync('agent-output.json', JSON.stringify(output));
          console.log('✅ Agent output written');
          console.log('Test passed:', testResult.passed);
          console.log('Error:', testResult.error?.slice(0, 200));
          JSEOF

      # ── 8. Read all source files ──────────────────────────────────
      - name: Read source + page object files
        run: |
          node << 'JSEOF'
          const fs   = require('fs');
          const path = require('path');

          const testFile = '${{ github.event.inputs.test_file }}';
          const sources  = {};

          function readDir(dir, maxDepth = 3, depth = 0) {
            if (!fs.existsSync(dir) || depth > maxDepth) return;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory()) readDir(full, maxDepth, depth + 1);
              else if (f.name.match(/\.(js|ts|mjs)$/) && !f.name.includes('.config.')) {
                const content = fs.readFileSync(full, 'utf8');
                sources[full] = content.slice(0, 4000); // 4K per file
              }
            }
          }

          // Always read the failing test file (full content)
          if (fs.existsSync(testFile)) {
            sources[testFile] = fs.readFileSync(testFile, 'utf8');
            console.log(`✅ Test file: ${testFile} (${sources[testFile].length} chars)`);
          }

          // Read page objects, utils, fixtures
          readDir('pages');
          readDir('utils');
          if (fs.existsSync('fixtures.js'))  sources['fixtures.js']  = fs.readFileSync('fixtures.js', 'utf8');
          if (fs.existsSync('fixtures.ts'))  sources['fixtures.ts']  = fs.readFileSync('fixtures.ts', 'utf8');

          // Read playwright config
          if (fs.existsSync('playwright.config.js')) sources['playwright.config.js'] = fs.readFileSync('playwright.config.js', 'utf8').slice(0, 2000);

          console.log(`📁 Source files: ${Object.keys(sources).join(', ')}`);
          fs.writeFileSync('source-files.json', JSON.stringify(sources));
          JSEOF

      # ── 9. Upload artifacts for reference ────────────────────────
      - name: Upload agent artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-fix-agent-artifacts
          path: |
            test-results/
            agent-output.json
            source-files.json
            test-output.txt
          retention-days: 7

      # ── 10. POST everything back to the WhatsApp bot ─────────────
      - name: Send agent results to bot
        run: |
          node << 'JSEOF'
          const fs    = require('fs');
          const https = require('https');
          const http  = require('http');
          const url   = require('url');

          const botUrl    = '${{ secrets.BOT_WEBHOOK_URL }}';
          const botSecret = '${{ secrets.BOT_SECRET }}';

          if (!botUrl) { console.error('❌ BOT_WEBHOOK_URL secret not set!'); process.exit(1); }

          const agentOutput = JSON.parse(fs.readFileSync('agent-output.json', 'utf8'));
          const sourceFiles = JSON.parse(fs.readFileSync('source-files.json', 'utf8'));

          const payload = JSON.stringify({
            secret:      botSecret,
            type:        'ai_fix_context',
            phone:       '${{ github.event.inputs.phone_number }}',
            issueNumber: parseInt('${{ github.event.inputs.issue_number }}'),
            testTitle:   '${{ github.event.inputs.test_title }}',
            testFile:    '${{ github.event.inputs.test_file }}',
            runUrl:      'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            testResult:  agentOutput.testResult,
            artifacts: {
              screenshotBase64: agentOutput.screenshotBase64,
              domSnapshot:      agentOutput.domSnapshot,
              traceFiles:       agentOutput.traceFiles,
              rawErrorOutput:   agentOutput.rawErrorOutput,
            },
            sourceFiles,
          });

          console.log(`📤 Sending to bot: ${botUrl}/ai-fix-callback`);
          console.log(`   Payload size: ${Math.round(payload.length / 1024)}KB`);
          console.log(`   Screenshot: ${agentOutput.screenshotBase64?.length > 100 ? 'YES ✅' : 'NO ❌'}`);
          console.log(`   DOM snapshot: ${agentOutput.domSnapshot?.length > 10 ? 'YES ✅' : 'NO ❌'}`);
          console.log(`   Source files: ${Object.keys(sourceFiles).length}`);

          const endpoint = new url.URL('/ai-fix-callback', botUrl);
          const isHttps  = endpoint.protocol === 'https:';
          const options  = {
            hostname: endpoint.hostname,
            port:     endpoint.port || (isHttps ? 443 : 80),
            path:     endpoint.pathname,
            method:   'POST',
            headers:  {
              'Content-Type':   'application/json',
              'Content-Length': Buffer.byteLength(payload),
              'x-bot-secret':   botSecret,
            },
          };

          const proto = isHttps ? https : http;
          const req   = proto.request(options, res => {
            let body = '';
            res.on('data', d => body += d);
            res.on('end', () => {
              if (res.statusCode === 200) {
                console.log(`✅ Bot notified successfully (${res.statusCode})`);
              } else {
                console.error(`❌ Bot returned ${res.statusCode}: ${body}`);
                process.exit(1);
              }
            });
          });

          req.on('error', e => {
            console.error('❌ Failed to reach bot:', e.message);
            process.exit(1);
          });

          req.setTimeout(30000, () => {
            console.error('❌ Request timed out');
            req.destroy();
            process.exit(1);
          });

          req.write(payload);
          req.end();
          JSEOF

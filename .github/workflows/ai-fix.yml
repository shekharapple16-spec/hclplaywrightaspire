name: AI Fix Agent

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Failing test file (e.g. tests/day3/test1.spec.js)'
        required: true
      test_title:
        description: 'Exact test title'
        required: true
      phone_number:
        description: 'WhatsApp phone (country code, no +)'
        required: true
      original_error:
        description: 'Error from first run (for richer Groq context)'
        required: false
        default: ''

jobs:
  ai-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ✅ CRITICAL FIX — move env here
    env:
      GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
      BOT_WEBHOOK_URL:  ${{ secrets.BOT_WEBHOOK_URL }}
      BOT_SECRET:       ${{ secrets.BOT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ✅ Debug (optional, remove later)
      - name: Debug GROQ
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY missing"
          else
            echo "✅ GROQ_API_KEY present"
          fi

      - name: Run failing test
        run: |
          npx playwright test \
            "${{ github.event.inputs.test_file }}" \
            --grep "${{ github.event.inputs.test_title }}" \
            --retries=0 \
            --reporter=line
        continue-on-error: true
        env:
          PHONE_NUMBER:   ${{ github.event.inputs.phone_number }}
          RUN_URL:        https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ORIGINAL_ERROR: ${{ github.event.inputs.original_error }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-fix-artifacts
          path: test-results/
          retention-days: 3
